<text x="740" y="1152.0" fill="#868e96" font-family="monospace" font-size="14">publish discovered directories</text>
<text x="70" y="1206.0" fill="#343a40" font-family="monospace" font-size="16">Queue full? Metadata runs locally.</text>
<text x="70" y="1226.0" fill="#343a40" font-family="monospace" font-size="16">Directory overflow keeps IDs only;</text>
<text x="70" y="1246.0" fill="#343a40" font-family="monospace" font-size="16">redistribute when capacity returns.</text>
<text x="70" y="1266.0" fill="#343a40" font-family="monospace" font-size="16">No recursive worker call stack.</text>
<rect x="810" y="1220" width="710" height="135" rx="12" stroke="#1971c2" fill="#e7f5ff" stroke-width="1.5"/>
<text x="826" y="1250.0" fill="#1971c2" font-family="monospace" font-size="14">Join worker Parts without copying every file</text>
<text x="826" y="1267.5" fill="#1971c2" font-family="monospace" font-size="14">model::finish_accounting()</text>
<text x="826" y="1285.0" fill="#1971c2" font-family="monospace" font-size="14">1. Reverse directory reduction: ordinary totals + errors</text>
<text x="826" y="1302.5" fill="#1971c2" font-family="monospace" font-size="14">2. Group hardlinks by (device, inode), count once per ancestor</text>
<text x="826" y="1320.0" fill="#1971c2" font-family="monospace" font-size="14">Includes directory own size; shared usage; saturating sums</text>
