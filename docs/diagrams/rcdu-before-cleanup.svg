<text x="1375" y="764.0" fill="#868e96" font-family="monospace" font-size="14">lazy directory listings</text>
<text x="70" y="438.0" fill="#e67700" font-family="monospace" font-size="18">Terminal ownership</text>
<text x="70" y="476.0" fill="#343a40" font-family="monospace" font-size="16">os/linux/curses.rs wraps ncursesw.</text>
<text x="70" y="496.0" fill="#343a40" font-family="monospace" font-size="16">The session/browser thread owns the UI.</text>
<text x="70" y="516.0" fill="#343a40" font-family="monospace" font-size="16">Signals, q and terminal errors cancel scans.</text>
<text x="70" y="536.0" fill="#343a40" font-family="monospace" font-size="16">Guards restore terminal state on exit.</text>
<text x="70" y="601.0" fill="#343a40" font-family="monospace" font-size="16">EX1 interactive import bypasses full-tree loading.</text>
<text x="70" y="621.0" fill="#343a40" font-family="monospace" font-size="16">Its browser loads the current directory and retains</text>
<text x="70" y="641.0" fill="#343a40" font-family="monospace" font-size="16">ancestry frames; deletion and refresh are disabled.</text>
<text x="70" y="661.0" fill="#343a40" font-family="monospace" font-size="16">Imported models disable mutations by default.</text>
<rect x="30" y="820" width="1940" height="590" rx="14" fill="white" stroke="#dee2e6"/>
<text x="55" y="864.0" fill="#343a40" font-family="monospace" font-size="24">02  Parallel scanning and compact storage</text>
<text x="55" y="889.0" fill="#868e96" font-family="monospace" font-size="14">scan.rs exposes directory jobs AND metadata jobs, allowing several workers to scan one wide directory.</text>
<rect x="70" y="940" width="320" height="145" rx="12" stroke="#1971c2" fill="#e7f5ff" stroke-width="1.5"/>
<text x="86" y="970.0" fill="#1971c2" font-family="monospace" font-size="14">Open + verify root descriptor</text>
<text x="86" y="987.5" fill="#1971c2" font-family="monospace" font-size="14">-t 0: available CPU count</text>
<text x="86" y="1005.0" fill="#1971c2" font-family="monospace" font-size="14">-t N: explicit worker count</text>
<text x="86" y="1022.5" fill="#1971c2" font-family="monospace" font-size="14">Descriptor budget limits pool</text>
<text x="86" y="1040.0" fill="#1971c2" font-family="monospace" font-size="14">os/linux.rs</text>
<rect x="440" y="940" width="320" height="145" rx="12" stroke="#1971c2" fill="#e7f5ff" stroke-width="1.5"/>
<text x="456" y="970.0" fill="#1971c2" font-family="monospace" font-size="14">Shared bounded job queue</text>
<text x="456" y="987.5" fill="#1971c2" font-family="monospace" font-size="14">Mutex + Condvar</text>
<text x="456" y="1005.0" fill="#1971c2" font-family="monospace" font-size="14">Directory ID jobs</text>
<text x="456" y="1022.5" fill="#1971c2" font-family="monospace" font-size="14">Metadata batch jobs</text>
<text x="456" y="1040.0" fill="#1971c2" font-family="monospace" font-size="14">Outstanding job counter</text>
<rect x="810" y="940" width="320" height="145" rx="12" stroke="#2b8a3e" fill="#ebfbee" stroke-width="1.5"/>
<text x="826" y="970.0" fill="#2b8a3e" font-family="monospace" font-size="14">Any scan worker enumerates</text>
<text x="826" y="987.5" fill="#2b8a3e" font-family="monospace" font-size="14">getdents64: 32 KiB buffer</text>
<text x="826" y="1005.0" fill="#2b8a3e" font-family="monospace" font-size="14">Up to 256 names per batch</text>
<text x="826" y="1022.5" fill="#2b8a3e" font-family="monospace" font-size="14">Shared parent descriptor</text>
<text x="826" y="1040.0" fill="#2b8a3e" font-family="monospace" font-size="14">Raw basename bytes</text>
<rect x="1180" y="940" width="340" height="145" rx="12" stroke="#2b8a3e" fill="#ebfbee" stroke-width="1.5"/>
<text x="1196" y="970.0" fill="#2b8a3e" font-family="monospace" font-size="14">Any worker observes metadata</text>
<text x="1196" y="987.5" fill="#2b8a3e" font-family="monospace" font-size="14">fstatat + classify + exclusions</text>
<text x="1196" y="1005.0" fill="#2b8a3e" font-family="monospace" font-size="14">Filesystem / cache / kernel rules</text>
<text x="1196" y="1022.5" fill="#2b8a3e" font-family="monospace" font-size="14">Discover child directory IDs</text>
<text x="1196" y="1040.0" fill="#2b8a3e" font-family="monospace" font-size="14">Accumulate ordinary subtotal</text>
<rect x="1570" y="940" width="340" height="145" rx="12" stroke="#2b8a3e" fill="#ebfbee" stroke-width="1.5"/>
<text x="1586" y="970.0" fill="#2b8a3e" font-family="monospace" font-size="14">Append to worker-owned Part</text>
<text x="1586" y="987.5" fill="#2b8a3e" font-family="monospace" font-size="14">24-byte Entry records</text>
<text x="1586" y="1005.0" fill="#2b8a3e" font-family="monospace" font-size="14">4096-entry storage chunks</text>
<text x="1586" y="1022.5" fill="#2b8a3e" font-family="monospace" font-size="14">64 KiB raw-name chunks</text>
<text x="1586" y="1040.0" fill="#2b8a3e" font-family="monospace" font-size="14">Directory spans + side records</text>
