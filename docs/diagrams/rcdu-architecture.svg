<polyline points="1430,1445 1520,1445" fill="none" stroke="#868e96" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1020" y="1564.0" fill="#343a40" font-family="monospace" font-size="14">Partial deletion: rebuild successful removals and report failures.</text>
<text x="1020" y="1581.5" fill="#343a40" font-family="monospace" font-size="14">Refresh incomplete non-cancelled cases; r rescans on demand.</text>
<text x="1020" y="1599.0" fill="#343a40" font-family="monospace" font-size="14">Optional b shell uses $SHELL; curses suspends and resumes.</text>
<text x="40" y="1714.0" fill="#868e96" font-family="monospace" font-size="14">Verification: scanner/config/display/mutation Rust tests plus disposable CLI and PTY fixtures for D file/directory deletion.</text></svg>
